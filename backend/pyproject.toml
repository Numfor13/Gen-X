[project]
name = "mysureguy-backend"
version = "0.1.0"
description = "MySureGuy: trust and matching for artisans in Buea (demo MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "boto3>=1.35",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "uvicorn>=0.30",
    "moto[dynamodb]>=5",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
